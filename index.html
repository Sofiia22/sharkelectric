<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031626" />
    <meta
      name="description"
      content="Shark Electric — licensed electrical services in Sarasota, Florida. Call, email, request an estimate, or view our services."
    />
    <title>Shark Electric | Sarasota, FL</title>
    <link rel="preload" href="assets/shark-electric-reference.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="brand" aria-label="Shark Electric, license EC13006923">
        <img
          src="assets/shark-electric-reference.png"
          alt="Shark Electric — License EC13006923"
          width="1024"
          height="1536"
        />
      </header>

      <section class="actions" aria-label="Contact Shark Electric">
        <a
          class="action-card action-card--blue"
          href="https://share.google/yIzrLAbKf4ZCT8twC"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Leave Shark Electric a Google review"
        >
          <span class="icon-ring" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="m32 7 7.7 15.6L57 25.1 44.5 37.3l3 17.2L32 46.4l-15.5 8.1 3-17.2L7 25.1l17.3-2.5L32 7Z" /></svg>
          </span>
          <span class="card-copy">
            <strong>Leave a Review</strong>
            <span class="card-subline"><b class="google-mark">G</b> Google <span class="plus">+</span> <b class="yelp-mark">✦</b> Yelp</span>
          </span>
        </a>

        <a
          class="action-card action-card--gold"
          href="https://www.sharkelectricfl.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View electrical services offered by Shark Electric"
        >
          <span class="icon-ring" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="M37 4 15 36h15l-3 24 22-35H35l2-21Z" /></svg>
          </span>
          <span class="card-copy">
            <strong>Services Offered</strong>
            <span class="card-subline"><svg class="mini-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg> sharkelectricfl.com</span>
          </span>
        </a>

        <a
          class="action-card action-card--gold"
          href="mailto:sharkelectric1@gmail.com?subject=Question%20for%20Shark%20Electric"
          aria-label="Email Shark Electric with a question"
        >
          <span class="icon-ring" aria-hidden="true">
            <svg viewBox="0 0 64 64"><rect x="10" y="17" width="44" height="31" rx="3"/><path d="m12 20 20 16 20-16"/></svg>
          </span>
          <span class="card-copy">
            <strong>Ask a Question</strong>
            <span class="card-subline"><b class="gmail-mark">M</b> Email us</span>
          </span>
        </a>

        <a
          class="action-card action-card--blue"
          href="mailto:sharkelectric1@gmail.com?subject=Request%20an%20Estimate&amp;body=Please%20tell%20us%20about%20your%20project%3A%0A%0A"
          aria-label="Request an estimate from Shark Electric by email"
        >
          <span class="icon-ring" aria-hidden="true">
            <svg class="outline-icon" viewBox="0 0 64 64"><path d="M18 8h22l8 8v40H18V8Z"/><path d="M40 8v10h10M25 28h16M25 36h10"/><text x="32" y="51">$</text></svg>
          </span>
          <span class="card-copy">
            <strong>Request an Estimate</strong>
            <span class="card-subline"><b class="gmail-mark">M</b> Email us</span>
          </span>
        </a>

        <a class="action-card action-card--blue" href="tel:+19413301299" aria-label="Call Shark Electric at 941-330-1299">
          <span class="icon-ring" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="M18 8c3-2 8 9 9 13 1 3-5 5-5 8 1 7 7 13 14 14 3 0 5-6 8-5 4 1 15 6 13 9-3 6-9 10-16 9C23 54 10 41 8 23 7 17 12 11 18 8Z" /></svg>
          </span>
          <span class="card-copy">
            <strong>Call Us</strong>
            <span class="phone">941-330-1299</span>
          </span>
        </a>

        <a
          class="action-card action-card--gold"
          href="https://www.facebook.com/shark.electric"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Shark Electric on Facebook"
        >
          <span class="icon-ring facebook-ring" aria-hidden="true"><b>f</b></span>
          <span class="card-copy"><strong>Visit Our<br />Facebook Page</strong></span>
        </a>
      </section>

      <div class="footer-bolt" aria-hidden="true">ϟ</div>
